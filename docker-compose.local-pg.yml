# Deprecated: host PostgreSQL settings now live in docker-compose.override.yml
# (auto-loaded on every docker compose command).
#
# This file is kept for backwards compatibility with older scripts that pass:
#   -f docker-compose.yml -f docker-compose.local-pg.yml

services:
  postgres:
    profiles:
      - with-docker-db

  backend:
    depends_on: !reset []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=host.docker.internal;Port=${POSTGRES_PORT:-5432};Database=${POSTGRES_DB:-dms_erp_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Pooling=true;MinPoolSize=1;MaxPoolSize=50
      Cors__AllowedOrigins__6: ${LAN_FRONTEND_URL:-}
      Cors__AllowedOrigins__7: ${LAN_POS_URL:-}
