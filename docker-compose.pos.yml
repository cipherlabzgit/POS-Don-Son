# Build / run browser POS only (from scratch).
# Usage on client server:
#   docker compose -f docker-compose.pos.yml build --no-cache
#   docker compose -f docker-compose.pos.yml up -d
#
# Or:  .\scripts\build-pos-docker-from-scratch.ps1

name: donandsons-pos

services:
  pos:
    image: dms-pos:latest
    container_name: dms-pos
    restart: unless-stopped
    build:
      context: ./DMS-POS
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "22-alpine"
        NGINX_VERSION: "stable-alpine"
        APP_PORT: "5174"
        VITE_API_URL: ${VITE_API_URL:-http://123.231.10.22:5126}
    ports:
      - "${POS_PORT:-5174}:5174"
    environment:
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5174/ >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - dms-net

networks:
  dms-net:
    name: dms-network
    external: true
